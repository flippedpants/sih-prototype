services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:7474 >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15

  ingestion-frontend:
    build:
      context: ./app/ingestion-frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started

volumes:
  neo4j_data: