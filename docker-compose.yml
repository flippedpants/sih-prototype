x-analysis-service: &analysis-service
  build: .
  image: sih-prototype-zone1:local
  environment:
    NEO4J_URI: ${NEO4J_URI}
    NEO4J_USER: ${NEO4J_USER:-neo4j}
    NEO4J_PASSWORD: ${NEO4J_PASSWORD}
  depends_on:
    neo4j:
      condition: service_healthy

services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  placeholder-data:
    <<: *analysis-service
    profiles: ["placeholder"]
    command: python -m app.generate_placeholder_data

  validate-scoping:
    <<: *analysis-service
    profiles: ["analysis"]
    command: python -m app.validate_case_scoping

  project-graphs:
    <<: *analysis-service
    profiles: ["analysis"]
    command: python -m app.project_graphs

  core-algorithms:
    <<: *analysis-service
    profiles: ["analysis"]
    command: python -m app.run_core_algorithms

  structural-roles:
    <<: *analysis-service
    profiles: ["analysis"]
    command: python -m app.classify_structural_roles

  criticality:
    <<: *analysis-service
    profiles: ["analysis"]
    command: python -m app.compute_criticality

  financial-patterns:
    <<: *analysis-service
    profiles: ["analysis"]
    command: python -m app.detect_financial_patterns

volumes:
  neo4j_data:
