x-analysis-service: &analysis-service
  build: .
  image: sih-prototype-zone1:local
  environment: &analysis-environment
    NEO4J_URI: ${NEO4J_URI}
    NEO4J_USER: ${NEO4J_USER:-neo4j}
    NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
    AUTH_BOOTSTRAP_ADMIN_USERNAME: ${AUTH_BOOTSTRAP_ADMIN_USERNAME}
    AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD}
    AUTH_DB_PATH: ${AUTH_DB_PATH:-/data/auth/users.db}
  depends_on:
    neo4j:
      condition: service_healthy

services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    <<: *analysis-service
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      neo4j:
        condition: service_healthy
      analysis-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - auth_data:/data/auth
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/docs')"]
      interval: 5s
      timeout: 3s
      retries: 12

  analysis-init:
    <<: *analysis-service
    environment:
      <<: *analysis-environment
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    volumes:
      - ./dataset_generator/output/showcase:/app/dataset_generator/output:ro
    command: python -m app.run_full_analysis

  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"

  smoke-test:
    <<: *analysis-service
    profiles: ["smoke"]
    depends_on:
      api:
        condition: service_healthy
    command: python -m app.auth.smoke_test

  placeholder-data:
    <<: *analysis-service
    profiles: ["placeholder"]
    command: python -m app.generate_placeholder_data

  ingest-dataset:
    <<: *analysis-service
    profiles: ["dataset"]
    volumes:
      - ./dataset_generator/output:/app/dataset_generator/output:ro
    command: python -m app.ingest_dataset

  project-person-graph:
    <<: *analysis-service
    profiles: ["dataset"]
    command: python -m app.project_person_graph

  validate-scoping:
    <<: *analysis-service
    profiles: ["analysis"]
    command: python -m app.validate_case_scoping

  project-graphs:
    <<: *analysis-service
    profiles: ["analysis"]
    command: python -m app.project_graphs

  core-algorithms:
    <<: *analysis-service
    profiles: ["analysis"]
    command: python -m app.run_core_algorithms

  structural-roles:
    <<: *analysis-service
    profiles: ["analysis"]
    command: python -m app.classify_structural_roles

  criticality:
    <<: *analysis-service
    profiles: ["analysis"]
    command: python -m app.compute_criticality

  financial-patterns:
    <<: *analysis-service
    profiles: ["analysis"]
    command: python -m app.detect_financial_patterns

  summary-generation:
    <<: *analysis-service
    profiles: ["analysis"]
    environment:
      <<: *analysis-environment
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    command: python -m app.case_summaries

volumes:
  neo4j_data:
  auth_data:
